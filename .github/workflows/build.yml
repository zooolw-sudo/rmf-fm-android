name: Build RMF FM APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Ustawienie Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Przygotowanie licencji i środowiska Android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "android.useAndroidX=true" > gradle.properties

      - name: Instalacja Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Zbuduj plik APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Udostępnij plik APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: RMF-FM-Radio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
